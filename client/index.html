<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vynora Campus+ | Campus Services</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Vynora Campus+</h1>
        <p>Campus Services</p>
    </header>


    <main class="container">

        <!-- FREE ROOMS -->

        <section class="service-section">

            <h2>🏫 Free Rooms</h2>
            <p class="section-description">
                Find available rooms on campus
            </p>

            <div id="rooms-container" class="cards-container">
                <!-- Room cards will be created using JavaScript -->
            </div>

        </section>


        <!-- TIMETABLE -->

        <section class="service-section">

            <h2>📅 Timetable</h2>
            <p class="section-description">
                View your class schedul
            </p>

            <div id="timetable-container" class="cards-container">
                <!-- Timetable cards will be created using JavaScript -->
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
