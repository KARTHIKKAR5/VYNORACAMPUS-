<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vynora Campus+ | Campus Services</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Vynora Campus+</h1>
        <p>Campus Services</p>
    </header>


    <main class="container">

        <!-- FREE ROOMS -->

        <section class="service-section">

            <h2>🏫 Free Rooms</h2>

            <p class="section-description">
                Find available rooms on campus
            </p>

            <div class="filters">

                <button data-building="All">All</button>
                <button data-building="Main Block">Main Block</button>
                <button data-building="CSE Block">CSE Block</button>
                <button data-building="ECE Block">ECE Block</button>

            </div>

            <div id="rooms-container" class="cards-container">
                <!-- Room cards will be created using JavaScript -->
            </div>

        </section>


        <!-- TIMETABLE -->

        <section class="service-section">

            <h2>📅 Timetable</h2>

            <p class="section-description">
                View your class schedule
            </p>

            <div class="filters">

                <button data-day="All">All</button>
                <button data-day="Monday">Monday</button>
                <button data-day="Tuesday">Tuesday</button>
                <button data-day="Wednesday">Wednesday</button>

            </div>

            <div id="timetable-container" class="cards-container">
                <!-- Timetable cards will be created using JavaScript -->
            </div>

        </section>


        <!-- CAMPUS SERVICES -->

        <section class="service-section">

            <h2>🏢 Campus Services</h2>

            <p class="section-description">
                Explore useful services available on campus
            </p>

            <div class="filters">

                <button data-service="All">All</button>
                <button data-service="Academic">Academic</button>
                <button data-service="Food">Food</button>
                <button data-service="Health">Health</button>
                <button data-service="Facilities">Facilities</button>

            </div>

            <div id="services-container" class="cards-container">
                <!-- Service cards will be created using JavaScript -->
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
